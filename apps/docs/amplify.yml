version: 1
applications:
  - appRoot: apps/docs
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - rm -rf node_modules
            - npm install
            - npm install --no-save --platform=linux --libc=glibc --arch=x64 lightningcss @parcel/watcher @tailwindcss/oxide
        build:
          commands:
            - npm run build --workspace=docs
      artifacts:
        baseDirectory: apps/docs/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/docs/.next/cache/**/*
