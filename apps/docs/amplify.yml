version: 1
applications:
  - appRoot: apps/docs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - cd $CODEBUILD_SRC_DIR && npm ci
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR && npm run build --workspace=docs
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - $CODEBUILD_SRC_DIR/node_modules/**/*
          - .next/cache/**/*
