version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build --workspace=docs
  artifacts:
    baseDirectory: apps/docs/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/docs/.next/cache/**/*
