services:
  - type: web
    name: api
    env: node
    buildCommand: npm ci --ignore-scripts && cd apps/api && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      # Add your environment variables in Render dashboard:
      # - CLERK_SECRET_KEY
      # - NEXT_PUBLIC_SUPABASE_URL
      # - SUPABASE_SERVICE_ROLE_KEY
      # - NEXT_PUBLIC_GOOGLE_CLIENT_ID
      # - NEXT_PUBLIC_GOOGLE_CLIENT_SECRET
      # - NEXT_PUBLIC_INTERCOM_SECRET_KEY
      # - CORS_ORIGIN (your frontend URL, e.g., https://your-app.onrender.com)

