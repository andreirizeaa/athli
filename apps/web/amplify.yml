version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - rm -rf node_modules
            - npm install
            - npm install --no-save --os=linux --cpu=x64 --libc=glibc lightningcss @parcel/watcher @tailwindcss/oxide
        build:
          commands:
            - npm run build --workspace=app
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/web/.next/cache/**/*
