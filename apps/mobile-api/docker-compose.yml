services:
  api:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - GUNICORN_WORKERS=4
      - PORT=8000
    ports: ["8000:8000"]
    command: gunicorn -c gunicorn.conf.py main:app
    depends_on: [redis]
  worker:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - GOTO_NUM_THREADS=1
      - OPENCV_NUM_THREADS=1
      - OPENCV_OPENCL_RUNTIME=disabled
    tmpfs:
      - /tmp:rw,size=1g
    command: celery -A celery_app.celery worker --pool=prefork --concurrency=1 --without-gossip --without-mingle --without-heartbeat --loglevel=INFO -n analysis@%h
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
