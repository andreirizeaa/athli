version: 1
applications:
  - appRoot: apps/marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - rm -rf node_modules
            - npm install
        build:
          commands:
            - npm run build --workspace=www
      artifacts:
        baseDirectory: apps/marketing/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/marketing/.next/cache/**/*
