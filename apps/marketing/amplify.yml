version: 1
applications:
  - appRoot: apps/marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - rm -rf node_modules
            - npm install
            - npm install --no-save --platform=linux --libc=glibc --arch=x64 lightningcss @parcel/watcher @tailwindcss/oxide sharp
            - npm install --no-save @next/swc-linux-x64-gnu@16.0.7
        build:
          commands:
            - npm run build --workspace=www
      artifacts:
        baseDirectory: apps/marketing/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/marketing/.next/cache/**/*
