version: 1
applications:
  - appRoot: apps/marketing
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - echo "Current dir:" && pwd
            - echo "CODEBUILD_SRC_DIR:" && echo "$CODEBUILD_SRC_DIR"
            - cd "$CODEBUILD_SRC_DIR" && pwd && ls -la package-lock.json && npm ci
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR" && npm run build --workspace=www
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
