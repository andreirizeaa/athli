version: 1
applications:
  - appRoot: apps/marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm config set omit optional false
            - npm config set optional true
            - npm ci --include=optional
        build:
          commands:
            - npm run build --workspace=www
      artifacts:
        baseDirectory: apps/marketing/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/marketing/.next/cache/**/*
