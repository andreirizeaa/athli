# ──────────────────────────────────────────────────────────
# Athli API — Build, push to ECR, deploy to EC2
#
# Triggers on pushes to main that touch the API code.
# Phase 1: deploys to EU (eu-west-1) only.
# Phase 2: uncomment the deploy-us job to add US region.
# ──────────────────────────────────────────────────────────

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/service/**"
      - ".github/workflows/deploy-api.yml"

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: athli-service

# Only one deploy at a time — cancel in-progress runs
concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # 1. Build Docker image and push to ECR
  # ────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd apps/service

          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ────────────────────────────────────────────
  # 2. Deploy to EU EC2 (Phase 1)
  # ────────────────────────────────────────────
  deploy-eu:
    name: Deploy EU
    needs: build
    runs-on: ubuntu-latest
    environment: production-eu
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy to EU EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_EU_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo ==> Logging into ECR...",
              "aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "echo ==> Pulling latest image...",
              "cd /opt/athli",
              "docker compose -f docker-compose.prod.yml pull",
              "echo ==> Starting containers...",
              "docker compose -f docker-compose.prod.yml up -d",
              "echo ==> Waiting for health check...",
              "sleep 10",
              "curl -sfk https://localhost/health || { echo HEALTH CHECK FAILED; exit 1; }",
              "echo ==> Cleaning up old images...",
              "docker image prune -f",
              "echo ==> Deploy complete!"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_EU_INSTANCE_ID }}"

          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_EU_INSTANCE_ID }}" \
            --query "[Status, StandardOutputContent, StandardErrorContent]" \
            --output text

